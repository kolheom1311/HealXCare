<html>
<!-- Subject: 📅 Your Appointment Status Update with Dr. {{doctor_name}} 🏥 -->
<head></head>

<body>
  <div
    style="border: solid 1px #E5E5E5;border-radius: 5px;margin:0px auto; max-width:600px;width:600px;background:#fff;font-family: Lato, Helvetica, 'Helvetica Neue', Arial, 'sans-serif';">
    <table cellspacing="0" cellpadding="0" style="width: 100%;font-size: 14px;">
      <tbody>
        <tr>
          <td style="padding:32px">
            <div>
              <h1 style="margin: 0 0 32px;font-size:20px;text-align:center"><span><img src="https://i.imghippo.com/files/JDXO3117rnQ.jpg" width="400" height="78"><br>

            </div>
            <div style="background: #fff;border-radius: 10px;overflow: hidden;border: solid 1px #E5E5E5;">
              <table cellspacing="0" cellpadding="0" style="width:100%;font-size: 14px;">
                <tbody>
                  <tr>
                    <td>
                      <div style="padding: 32px 26px;text-align: center;">
                        <h2 style="margin:0 0 20px;font-size: 20px;">Appointment Status Update<br></h2>
                        <p style="margin: 0px; line-height: 1.6;">
                          <span class="size" style="font-size: 14px; margin: 0px; line-height: 1.6;">Dear <b>{{patient_name}}</b>,</span><br>
                        </p>
                        <p style="margin: 16px 0px; line-height: 1.6;">Your appointment with <b>Dr. {{doctor_name}}</b>

                          <span class="size" style="font-size:14px">{{status_message}}.</span><br></p>
                        <div>
                          <hr style="border-style: dashed;border-width: 1px 0 0;border-color: #CECECE;margin: 24px 0">
                          <br>
                        </div>
                        <p style="line-height: 1.6; margin: 24px 0px 0px;">
                          <span class="size" style="font-size: 14px; line-height: 1.6; margin: 24px 0px 0px;">For any inquiries, please contact us at <a href="mailto:support@healxcare.in" target="_blank">support@healxcare.in</a>.</span><br>
                        </p>
                        <div style="margin-top: 32px;line-height: 1.6;">
                          <p style="margin: 0px;">
                            <span class="size" style="font-size: 13px; margin: 0px;">Best Regards,</span><br></p>
                          <h3 style="font-size: 15px; margin: 4px 0 0;">Team HealXCare<br></h3>
                        </div>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </td>
        </tr>

    <br>
  </div>
